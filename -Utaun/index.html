:root {
  --bg: #ffffff;
  --fg: #000000;
  --panel-bg: #ffffff;
  --input-bg: #ffffff;
  --btn-bg: #f0f0f0;
  --btn-active: #d0d0d0;
  --border: #7f7f7f;
  --slider-bg: #c0c0c0;
  --muted: #555555;
  --accent: #000080;
  --shadow: rgba(0, 0, 0, 0.2);
}

[data-theme="dark"] {
  --bg: #121212;
  --fg: #e0e0e0;
  --panel-bg: #1e1e1e;
  --input-bg: #2a2a2a;
  --btn-bg: #333333;
  --btn-active: #444444;
  --border: #ffffff;
  --slider-bg: #444444;
  --muted: #aaaaaa;
  --accent: #8ab4ff;
  --shadow: rgba(0, 0, 0, 0.55);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --fg: #e0e0e0;
    --panel-bg: #1e1e1e;
    --input-bg: #2a2a2a;
    --btn-bg: #333333;
    --btn-active: #444444;
    --border: #ffffff;
    --slider-bg: #444444;
    --muted: #aaaaaa;
    --accent: #8ab4ff;
    --shadow: rgba(0, 0, 0, 0.55);
  }
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 0;
  background-color: var(--bg);
}

body {
  font-family: "MS Gothic", "ＭＳ ゴシック", monospace;
  color: var(--fg);
  background-color: var(--bg);
}

button, input, textarea {
  font-family: inherit;
}

.tkinter-window {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  min-height: calc(100dvh - var(--safe-area-inset-top));
  background-color: var(--bg);
  border: none;
  display: flex;
  flex-direction: column;
  padding: 20px;
  position: relative;
}

.screen {
  display: flex;
  flex-direction: column;
  min-height: calc(100dvh - var(--safe-area-inset-top) - 40px);
}

.top-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 15px;
  gap: 12px;
}

.app-title {
  font-size: clamp(24px, 7vw, 28px);
  font-weight: bold;
  margin: 0;
  line-height: 1.1;
  word-break: break-word;
}

.btn {
  background-color: var(--btn-bg);
  border: 1px solid var(--border);
  color: var(--fg);
  font-size: 12px;
  cursor: pointer;
  padding: 8px 10px;
  outline: none;
  text-align: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  border-radius: 0;
}

.btn:active {
  background-color: var(--btn-active);
}

.btn:disabled {
  opacity: 0.55;
  cursor: default;
}

.btn-listen {
  width: 100%;
  padding: 10px;
}

.btn-generate {
  width: 100%;
  font-size: 14px;
  font-weight: bold;
  padding: 10px;
}

.btn-primary {
  background-color: var(--fg);
  color: var(--bg);
  border-color: var(--fg);
  font-weight: bold;
}

.gear-btn {
  font-size: 16px;
  padding: 4px 8px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.input-wrap {
  border: 1px solid var(--border);
  background-color: var(--input-bg);
  display: block;
  padding: 1px;
  max-width: 100%;
}

input[type="text"] {
  border: none;
  outline: none;
  font-size: 16px;
  padding: 4px 6px;
  background: transparent;
  -webkit-user-select: text;
  -moz-user-select: text;
       user-select: text;
  width: 100%;
  max-width: 100%;
  color: var(--fg);
}

.form-group {
  margin-bottom: 12px;
  text-align: center;
  width: 100%;
  max-width: 100%;
}

.label {
  font-size: 13px;
  margin-bottom: 3px;
  display: block;
}

.main-input {
  width: 100%;
}

.main-textarea {
  width: 100%;
  height: 80px;
  resize: none;
  border: none;
  outline: none;
  font-size: 16px;
  padding: 4px;
  -webkit-user-select: text;
  -moz-user-select: text;
       user-select: text;
  background: var(--input-bg);
  color: var(--fg);
}

.main-textarea::-moz-placeholder {
  color: #888;
}

.main-textarea::placeholder {
  color: #888;
}

.radio-group {
  display: flex;
  justify-content: center;
  gap: 30px;
  font-size: 12px;
  margin-top: 2px;
  flex-wrap: wrap;
}

.radio-group label {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.slider-container {
  width: 100%;
  margin: 0 auto;
}

.height-num {
  font-size: 12px;
  text-align: right;
  margin-bottom: 2px;
}

input[type="range"] {
  width: 100%;
  accent-color: #555;
  background: var(--slider-bg);
  height: 6px;
}

.slider-ends {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
}

.action-area {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding-bottom: 10px;
  padding-top: 12px;
}

.settings-title {
  font-size: 16px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 20px;
}

.settings-section {
  text-align: center;
  margin-bottom: 20px;
}

.shortcut-box {
  border: 1px solid var(--border);
  padding: 10px;
  margin: 15px auto;
  width: 90%;
  max-width: 100%;
  text-align: left;
  font-size: 11px;
  background: var(--panel-bg);
  line-height: 1.7;
}

.custom-select-container {
  position: relative;
  width: 160px;
  max-width: 100%;
  margin: 6px auto 0 auto;
}

.select-box {
  background-color: var(--input-bg);
  border: 1px solid var(--border);
  padding: 4px 8px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  color: var(--fg);
}

.select-box:active {
  background-color: var(--btn-bg);
}

.dropdown-menu {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  max-height: 200px;
  overflow-y: auto;
  background-color: var(--input-bg);
  border: 1px solid var(--border);
  box-shadow: 2px 2px 5px var(--shadow);
  z-index: 10;
  text-align: left;
}

.dropdown-menu.open {
  display: block;
}

.dropdown-item {
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px dotted #e0e0e0;
}

.dropdown-item:last-child {
  border-bottom: none;
}

.dropdown-item:hover {
  background-color: #000080;
  color: #fff;
}

[data-theme="dark"] .dropdown-item:hover {
  background-color: #333;
  color: #fff;
}

.icon-preview-container {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.icon-thumb {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  -o-object-fit: cover;
     object-fit: cover;
  background: #fff;
  flex-shrink: 0;
}

.icon-thumb-empty {
  width: 32px;
  height: 32px;
  border: 1px dashed var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--muted);
  flex-shrink: 0;
  background: var(--input-bg);
}

.silent-note {
  display: block;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  line-height: 1.5;
}

.home-link {
  font-size: 11px;
  color: #888;
  text-align: center;
}

[data-theme="dark"] .home-link {
  color: #aaa;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 50;
}

.modal-box {
  background: var(--panel-bg);
  color: var(--fg);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 480px;
  max-height: 82vh;
  overflow-y: auto;
  padding: 18px;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.18);
}

.modal-title {
  font-size: 15px;
  font-weight: bold;
  margin: 0 0 10px;
}

.modal-text {
  font-size: 12px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}

.missing-list {
  margin: 10px 0;

  border: 1px solid var(--border);
  background: var(--input-bg);
  font-size: 12px;
  line-height: 1.6;
  max-height: 180px;
  overflow-y: auto;
}

.modal-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.modal-actions .btn {
  flex: 1;
  min-width: 120px;
}
