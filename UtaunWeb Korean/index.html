<style>

[data-theme="dark"]{--bg:#121212;--fg:#e0e0e0;--panel-bg:#1e1e1e;--input-bg:#2a2a2a;--btn-bg:#333;--btn-active:#444;--border:#fff;--slider-bg:#444;--muted:#aaa;--accent:#9db4ff}

rder-bottom:none}.tk-input-wrap{border:1px solid var(--border);background:var(--input-bg);display:block;padding:1px}.tk-input-wrap input[type="text"]{border:none;outline:none;font-size:16px;padding:4px 6px;background:transparent;width:100%;color:var(--fg)}.tk-textarea{width:100%;height:80px;resize:none;border:none;outline:none;font-size:16px;padding:4px;background:var(--input-bg);color:var(--fg)}input[type="range"]{width:100%;accent-color:#555;background:var(--slider-bg);height:6px}.hidden-logic{display:none!important}

<div style="margin-bottom:12px;text-align:center"><label id="lbl-name" for="input-name" style="font-size:13px;margin-bottom:3px;display:block">이름</label><div class="tk-input-wrap"><input id="input-name" type="text" autocomplete="off" value=""></div></div>
<div style="margin-bottom:12px;text-align:center"><label id="lbl-author" for="input-author" style="font-size:13px;margin-bottom:3px;display:block">작성자</label><div class="tk-input-wrap"><input id="input-author" type="text" autocomplete="off" value=""></div></div>

<div style="margin-bottom:12px;text-align:center"><span id="lbl-icon" style="font-size:13px;margin-bottom:3px;display:block">ICON</span><input type="file" id="icon-file-input" accept="image/png, image/jpeg, image/webp, image/bmp" style="display:none"><div style="display:flex;align-items:center;gap:8px;max-width:100%"><img id="icon-thumb" class="icon-thumb" alt="Preview" style="width:32px;height:32px;border:1px solid var(--border);object-fit:cover;background:#fff;display:none;flex-shrink:0"><button class="btn" id="btn-icon" type="button" style="flex:1 1 0%">이미지 선택</button></div></div>

Ctrl + P     | Listen
Ctrl + A     | Select All
Ctrl + C / V | Copy / Paste
Enter        | Save &amp; Close</div></div>
<div class="action-area"><button type="button" class="btn" id="btn-close-settings" style="width:120px;font-weight:bold">적용</button></div>
</div>
