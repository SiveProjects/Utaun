  margin: 0;
  /* 2 */
  padding: 0;
  /* 3 */

input:where([type='button']),
input:where([type='reset']),
input:where([type='submit']) {

  background-color: transparent;
  /* 2 */
  background-image: none;
  /* 2 */
}

dl,
dd,

h2,
h3,
h4,
h5,
h6,

p,
pre {

}

fieldset {
  margin: 0;
  padding: 0;

:root{
  --bg:#ffffff;
  --fg:#000000;
  --panel-bg:#ffffff;
  --input-bg:#ffffff;
  --btn-bg:#f0f0f0;
  --btn-active:#d0d0d0;
  --border:#7f7f7f;
  --slider-bg:#c0c0c0;
  --muted:#555555;
  --accent:#000080;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#121212;
    --fg:#e0e0e0;
    --panel-bg:#1e1e1e;
    --input-bg:#2a2a2a;
    --btn-bg:#333333;
    --btn-active:#444444;
    --border:#ffffff;
    --slider-bg:#444444;
    --muted:#aaaaaa;
    --accent:#9db4ff;
  }
}

[data-theme="light"]{
  --bg:#ffffff;
  --fg:#000000;
  --panel-bg:#ffffff;
  --input-bg:#ffffff;
  --btn-bg:#f0f0f0;
  --btn-active:#d0d0d0;
  --border:#7f7f7f;
  --slider-bg:#c0c0c0;
  --muted:#555555;
  --accent:#000080;
}

[data-theme="dark"]{
  --bg:#121212;
  --fg:#e0e0e0;
  --panel-bg:#1e1e1e;
  --input-bg:#2a2a2a;
  --btn-bg:#333333;
  --btn-active:#444444;
  --border:#ffffff;
  --slider-bg:#444444;
  --muted:#aaaaaa;
  --accent:#9db4ff;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg)
}

body{
  font-family:"MS Gothic","Malgun Gothic",monospace;
  color:var(--fg);
  background:var(--bg)
}

input,textarea,button,select{
  font-family:inherit
}

button{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer
}

input[type="text"],textarea{
  -webkit-user-select:text;
  -moz-user-select:text;
       user-select:text
}

.btn{
  background:var(--btn-bg);
  border:1px solid var(--border);
  color:var(--fg);
  font-size:12px;
  cursor:pointer;
  padding:8px 10px;
  outline:none;
  text-align:center;
  border-radius:0;
  -webkit-appearance:none;
     -moz-appearance:none;
          appearance:none
}

.btn:active{
  background:var(--btn-active)
}

.btn:disabled{
  opacity:.55;
  cursor:default
}

.gear-btn{
  font-size:16px;
  padding:4px 8px;
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px
}

.btn-listen,.btn-generate{
  width:100%;
  padding:10px;
  font-size:12px;
  line-height:1.5;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center
}

.btn-generate{
  font-weight:bold
}

.btn-primary{
  background:var(--fg);
  color:var(--bg);
  border-color:var(--fg);
  font-weight:bold
}

.action-area{
  margin-top:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  width:100%;
  padding-bottom:10px
}

.custom-select-container{
  position:relative;
  width:160px;
  margin:6px auto 0
}

.select-box{
  background:var(--input-bg);
  border:1px solid var(--border);
  padding:4px 8px;
  font-size:13px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  color:var(--fg)
}

.select-box:active{
  background:var(--btn-bg)
}

.dropdown-menu{
  display:none;
  position:absolute;
  top:100%;
  left:0;
  width:100%;
  max-height:200px;
  overflow-y:auto;
  background:var(--input-bg);
  border:1px solid var(--border);
  box-shadow:2px 2px 5px rgba(0,0,0,.2);
  z-index:10;
  text-align:left
}

.dropdown-menu.open{
  display:block
}

.dropdown-item{
  display:flex;
  width:100%;
  padding:6px 10px;
  font-size:12px;
  cursor:pointer;
  background:transparent;
  border:none;
  border-bottom:1px dotted #e0e0e0;
  color:var(--fg);
  text-align:left;
  align-items:center;
  gap:8px
}

.dropdown-item:last-child{
  border-bottom:none
}

.dropdown-item:hover{
  background:var(--btn-bg)
}

.dropdown-item.active{
  font-weight:bold;
  background:var(--btn-bg)
}

.tk-input-wrap{
  border:1px solid var(--border);
  background:var(--input-bg);
  display:block;
  padding:1px
}

.tk-input-wrap input[type="text"]{
  border:none;
  outline:none;
  font-size:16px;
  padding:4px 6px;
  background:transparent;
  width:100%;
  color:var(--fg)
}

.tk-textarea{
  width:100%;
  height:80px;
  resize:none;
  border:none;
  outline:none;
  font-size:16px;
  padding:4px;
  background:var(--input-bg);
  color:var(--fg)
}

input[type="range"]{
  width:100%;
  accent-color:#555;
  background:var(--slider-bg);
  height:6px
}

.hidden-logic{
  display:none!important
}
</style>
