  margin: 0;
  /* 2 */
  padding: 0;
  /* 3 */
}

/*
Remove the inheritance of text transform in Edge and Firefox.
*/

button,
select {
  text-transform: none;
}

/*
1. Correct the inability to style clickable types in iOS and Safari.
2. Remove default button styles.
*/

button,
input:where([type='button']),
input:where([type='reset']),
input:where([type='submit']) {
  -webkit-appearance: button;
  /* 1 */
  background-color: transparent;
  /* 2 */
  background-image: none;
  /* 2 */
}

/*
Use the modern Firefox focus style for all focusable elements.
*/

:-moz-focusring {
  outline: auto;
}

/*
Remove the additional `:invalid` styles in Firefox. (https://github.com/mozilla/gecko-dev/blob/2f9eacd9d3d995c937b4251a5557d95d494c9be1/layout/style/res/forms.css#L728-L737)
*/

:-moz-ui-invalid {
  box-shadow: none;
}

/*
Add the correct vertical alignment in Chrome and Firefox.
*/

progress {
  vertical-align: baseline;
}

/*
Correct the cursor style of increment and decrement buttons in Safari.
*/

::-webkit-inner-spin-button,
::-webkit-outer-spin-button {
  height: auto;
}

/*
1. Correct the odd appearance in Chrome and Safari.
2. Correct the outline style in Safari.
*/

[type='search'] {
  -webkit-appearance: textfield;
  /* 1 */
  outline-offset: -2px;
  /* 2 */
}

/*
Remove the inner padding in Chrome and Safari on macOS.
*/

::-webkit-search-decoration {
  -webkit-appearance: none;
}

/*
1. Correct the inability to style clickable types in iOS and Safari.
2. Change font properties to `inherit` in Safari.
*/

::-webkit-file-upload-button {
  -webkit-appearance: button;
  /* 1 */
  font: inherit;
  /* 2 */
}

/*
Add the correct display in Chrome and Safari.
*/

summary {
  display: list-item;
}

/*
Removes the default spacing and border for appropriate elements.
*/

blockquote,
dl,
dd,
h1,
h2,
h3,
h4,
h5,
h6,
hr,
figure,
p,
pre {
  margin: 0;
}

fieldset {
  margin: 0;
  padding: 0;
}

legend {
  padding: 0;
}

ol,
ul,
menu {
  list-style: none;
  margin: 0;
  padding: 0;
}

/*

*/

dialog {
  padding: 0;
}

/*

textarea {

  /* 1 */
  color: #9ca3af;
  /* 2 */

.fixed {

}

.block {

}

.inline {

}

.flex {

}

.inline-flex {

}

.border {
  border-width: 1px;
}

.filter {

}

:root {
  --bg: #ffffff;
  --fg: #000000;
  --panel-bg: #ffffff;
  --input-bg: #ffffff;
  --btn-bg: #f0f0f0;
  --btn-active: #d0d0d0;
  --border: #7f7f7f;
  --slider-bg: #c0c0c0;
  --muted: #555555;
  --accent: #000080;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --fg: #e0e0e0;
    --panel-bg: #1e1e1e;
    --input-bg: #2a2a2a;
    --btn-bg: #333333;
    --btn-active: #444444;
    --border: #ffffff;
    --slider-bg: #444444;
    --muted: #aaaaaa;
    --accent: #9db4ff;
  }
}

[data-theme="light"] {
  --bg: #ffffff;
  --fg: #000000;
  --panel-bg: #ffffff;
  --input-bg: #ffffff;
  --btn-bg: #f0f0f0;
  --btn-active: #d0d0d0;
  --border: #7f7f7f;
  --slider-bg: #c0c0c0;
  --muted: #555555;
  --accent: #000080;
}

[data-theme="dark"] {
  --bg: #121212;
  --fg: #e0e0e0;
  --panel-bg: #1e1e1e;
  --input-bg: #2a2a2a;
  --btn-bg: #333333;
  --btn-active: #444444;
  --border: #ffffff;
  --slider-bg: #444444;
  --muted: #aaaaaa;
  --accent: #9db4ff;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
}

body {
  font-family: "MS Gothic", "ＭＳ ゴシック", monospace;
  color: var(--fg);
  background: var(--bg);
}

input, textarea, button, select {
  font-family: inherit;
}

button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

input[type="text"], textarea {
  -webkit-user-select: text;
  -moz-user-select: text;
       user-select: text;
}

.tk-btn {
  background: var(--btn-bg);
  border: 1px solid var(--border);
  color: var(--fg);
  font-size: 12px;
  cursor: pointer;
  padding: 8px 10px;
  outline: none;
  text-align: center;
}

.tk-btn:active {
  background: var(--btn-active);
}

.tk-btn:disabled {
  opacity: 0.55;
  cursor: default;
}

.btn {
  background: var(--btn-bg);
  border: 1px solid var(--border);
  color: var(--fg);
  font-size: 12px;
  cursor: pointer;
  padding: 8px 10px;
  outline: none;
  text-align: center;
  border-radius: 0;
}

.btn:active {
  background: var(--btn-active);
}

.btn:disabled {
  opacity: 0.55;
  cursor: default;
}

.gear-btn {
  font-size: 16px;
  padding: 4px 8px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-listen,
.btn-generate {
  width: 100%;
  padding: 10px;
  font-size: 12px;
  line-height: 1.5;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-generate {
  font-weight: bold;
}

.btn-primary {
  background: var(--fg);
  color: var(--bg);
  border-color: var(--fg);
  font-weight: bold;
}

.action-area {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding-bottom: 10px;
}

.custom-select-container {
  position: relative;
  width: 160px;
  margin: 6px auto 0;
}

.select-box {
  background: var(--input-bg);
  border: 1px solid var(--border);
  padding: 4px 8px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  color: var(--fg);
}

.select-box:active {
  background: var(--btn-bg);
}

.dropdown-menu {
  display: block;
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  max-height: 200px;
  overflow-y: auto;
  background: var(--input-bg);
  border: 1px solid var(--border);
  box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
  z-index: 10;
  text-align: left;
}

.dropdown-item {
  display: flex;
  width: 100%;
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
  background: transparent;
  border: none;
  border-bottom: 1px dotted #e0e0e0;
  color: var(--fg);
  text-align: left;
  align-items: center;
  gap: 8px;
}

.dropdown-item:last-child {
  border-bottom: none;
}

.modal-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.modal-actions .btn {
  flex: 1;
  min-width: 120px;
}

.tk-input-wrap {
  border: 1px solid var(--border);
  background: var(--input-bg);
  display: block;
  padding: 1px;
}

.tk-input-wrap input[type="text"] {
  border: none;
  outline: none;
  font-size: 16px;
  padding: 4px 6px;
  background: transparent;
  width: 100%;
  color: var(--fg);
}

.tk-textarea {
  width: 100%;
  height: 80px;
  resize: none;
  border: none;
  outline: none;
  font-size: 16px;
  padding: 4px;
  background: var(--input-bg);
  color: var(--fg);
}

input[type="range"] {
  width: 100%;
  accent-color: #555;
  background: var(--slider-bg);
  height: 6px;
}
</style>
</head>
