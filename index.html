<html><head><style>
  #sister-box{
    border:3px solid var(--border);
    background:var(--input-bg);
    padding:14px 12px;
    margin:15px auto;
    width:90%;
    max-width:100%;
    text-align:center;
  }
  #sister-box-title{
    font-size:18px;
    font-weight:900;
    line-height:1.4;
    margin-bottom:12px;
  }
  .sister-btn{
    display:block;
    width:100%;
    box-sizing:border-box;
    background:var(--fg);
    color:var(--bg) !important;
    border:3px solid var(--fg);
    font-size:18px;
    font-weight:900;
    line-height:1.4;
    padding:14px 10px;
    margin:0 0 12px;
    text-align:center;
    text-decoration:none !important;
  }
  .sister-btn:last-child{ margin-bottom:0; }
  .sister-btn:active{ opacity:0.7; }

  /* 下の小さいリンクは消す（設定の箱の中のリンクは消さない） */
  a[href="./-Utaun/"]:not(.sister-btn){ display:none !important; }
  a[href="-Utaun/"]:not(.sister-btn){ display:none !important; }
  div:has(> a[href="./-Utaun/"]:not(.sister-btn)){ display:none !important; }
  div:has(> a[href="-Utaun/"]:not(.sister-btn)){ display:none !important; }
</style>
<script>
(function(){
  function buildBox(){
    var box = document.createElement('div');
    box.id = 'sister-box';
    var title = document.createElement('div');
    title.id = 'sister-box-title';
    title.textContent = '姉妹サイト / Sister Sites / 자매 사이트';
    var a1 = document.createElement('a');
    a1.className = 'sister-btn';
    a1.href = 'https://siveprojects.github.io/Utaun/UtaunWeb%20Korean/';
    a1.textContent = 'Utaun Korean を開く ↗';
    var a2 = document.createElement('a');
    a2.className = 'sister-btn';
    a2.href = 'https://siveprojects.github.io/Utaun/-Utaun/';
    a2.textContent = '-Utaun を開く ↗';
    box.appendChild(title);
    box.appendChild(a1);
    box.appendChild(a2);
    return box;
  }
  function hideSmallLink(){
    // :has が効かないブラウザ用の保険。設定の箱の中は触らない
    document.querySelectorAll('a[href="./-Utaun/"], a[href="-Utaun/"]').forEach(function(a){
      if (a.closest('#sister-box')) return;
      if (a.parentElement) a.parentElement.style.display = 'none';
      a.style.display = 'none';
    });
  }
  function tryInject(){
    hideSmallLink();
    if (document.getElementById('sister-box')) return;
    // 設定画面だけにある .action-area の直前に差し込む
    var area = document.querySelector('.action-area');
    if (!area || !area.parentNode) return;
    area.parentNode.insertBefore(buildBox(), area);
  }
  var root = document.getElementById('root') || document.body;
  if (root) {
    new MutationObserver(tryInject).observe(root, { childList:true, subtree:true });
  }
  tryInject();
})();
</script>
<!-- ===== 姉妹サイトボックス パッチ ここまで ===== -->
</head><body></body></html>
