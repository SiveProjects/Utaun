:root {
  --bg: #ffffff;
  --fg: #000000;
  --panel-bg: #ffffff;
  --input-bg: #ffffff;
  --btn-bg: #f0f0f0;
  --btn-active: #d0d0d0;
  --border: #7f7f7f;
  --slider-bg: #c0c0c0;
  --muted: #555555;
  --accent: #000080;
}

[data-theme="light"] {
  --bg: #ffffff;
  --fg: #000000;
  --panel-bg: #ffffff;
  --input-bg: #ffffff;
  --btn-bg: #f0f0f0;
  --btn-active: #d0d0d0;
  --border: #7f7f7f;
  --slider-bg: #c0c0c0;
  --muted: #555555;
  --accent: #000080;
}

[data-theme="dark"] {
  --bg: #121212;
  --fg: #e0e0e0;
  --panel-bg: #1e1e1e;
  --input-bg: #2a2a2a;
  --btn-bg: #333333;
  --btn-active: #444444;
  --border: #ffffff;
  --slider-bg: #444444;
  --muted: #aaaaaa;
  --accent: #9db4ff;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
}

body {
  font-family: "MS Gothic", "ＭＳ ゴシック", monospace;
  color: var(--fg);
  background: var(--bg);
}

input, textarea, button, select {
  font-family: inherit;
}

button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.btn {
  background: var(--btn-bg);
  border: 1px solid var(--border);
  color: var(--fg);
  font-size: 12px;
  cursor: pointer;
  padding: 8px 10px;
  outline: none;
  text-align: center;
  border-radius: 0;
}

.btn:active {
  background: var(--btn-active);
}

.btn:disabled {
  opacity: 0.55;
  cursor: default;
}

.btn-listen, .btn-generate {
  width: 100%;
  padding: 10px;
  font-size: 12px;
  line-height: 1.5;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-generate {
  font-weight: bold;
}

.btn-primary {
  background: var(--fg);
  color: var(--bg);
  border-color: var(--fg);
  font-weight: bold;
}

.tk-input-wrap {
  border: 1px solid var(--border);
  background: var(--input-bg);
  display: block;
  padding: 1px;
}

.tk-input-wrap input[type="text"] {
  border: none;
  outline: none;
  font-size: 16px;
  padding: 4px 6px;
  background: transparent;
  width: 100%;
  color: var(--fg);
}

.tk-textarea {
  width: 100%;
  height: 80px;
  resize: none;
  border: none;
  outline: none;
  font-size: 16px;
  padding: 4px;
  background: var(--input-bg);
  color: var(--fg);
}

input[type="range"] {
  width: 100%;
  accent-color: #555;
  background: var(--slider-bg);
  height: 6px;
}

select.select-box {
  background: var(--input-bg);
  border: 1px solid var(--border);
  padding: 6px 8px;
  font-size: 13px;
  color: var(--fg);
  width: 220px;
  border-radius: 0;
}

.lang-select, .lang-select button {
  font-family: "MS Gothic", "ＭＳ ゴシック", monospace, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol";
}

.lang-emoji {
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", "MS Gothic", "ＭＳ ゴシック", monospace;
  font-variant-emoji: emoji;
}
