  margin: 0;
  /* 2 */

  /* 3 */

  /* 2 */

:root {
  --bg: #ffffff;
  --fg: #000000;
  --panel-bg: #ffffff;
  --input-bg: #ffffff;
  --btn-bg: #f0f0f0;
  --btn-active: #d0d0d0;
  --border: #7f7f7f;
  --slider-bg: #c0c0c0;
  --muted: #555555;
  --accent: #000080;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --fg: #e0e0e0;
    --panel-bg: #1e1e1e;
    --input-bg: #2a2a2a;
    --btn-bg: #333333;
    --btn-active: #444444;
    --border: #ffffff;
    --slider-bg: #444444;
    --muted: #aaaaaa;
    --accent: #9db4ff;
  }
}

[data-theme="light"] {
  --bg: #ffffff;
  --fg: #000000;
  --panel-bg: #ffffff;
  --input-bg: #ffffff;
  --btn-bg: #f0f0f0;
  --btn-active: #d0d0d0;
  --border: #7f7f7f;
  --slider-bg: #c0c0c0;
  --muted: #555555;
  --accent: #000080;
}

[data-theme="dark"] {
  --bg: #121212;
  --fg: #e0e0e0;
  --panel-bg: #1e1e1e;
  --input-bg: #2a2a2a;
  --btn-bg: #333333;
  --btn-active: #444444;
  --border: #ffffff;
  --slider-bg: #444444;
  --muted: #aaaaaa;
  --accent: #9db4ff;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
}

body {
  font-family: "MS Gothic", "ＭＳ ゴシック", monospace;
  color: var(--fg);
  background: var(--bg);
}

input, textarea, button, select {
  font-family: inherit;
}

button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

input[type="text"], textarea {
  -webkit-user-select: text;
  -moz-user-select: text;
       user-select: text;
}

.tk-btn {
  background: var(--btn-bg);
  border: 1px solid var(--border);
  color: var(--fg);
  font-size: 12px;
  cursor: pointer;
  padding: 8px 10px;
  outline: none;
  text-align: center;
}

.tk-btn:active {
  background: var(--btn-active);
}

.tk-btn:disabled {
  opacity: 0.55;
  cursor: default;
}

.tk-input-wrap {
  border: 1px solid var(--border);
  background: var(--input-bg);
  display: block;
  padding: 1px;
}

.tk-input-wrap input[type="text"] {
  border: none;
  outline: none;
  font-size: 16px;
  padding: 4px 6px;
  background: transparent;
  width: 100%;
  color: var(--fg);
}

.tk-textarea {
  width: 100%;
  height: 80px;
  resize: none;
  border: none;
  outline: none;
  font-size: 16px;
  padding: 4px;
  background: var(--input-bg);
  color: var(--fg);
}

input[type="range"] {
  width: 100%;
  accent-color: #555;
  background: var(--slider-bg);
  height: 6px;
}
</style>
