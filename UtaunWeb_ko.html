:root{
  --bg:#ffffff;
  --text:#000000;
  --fg:#000000;
  --panel:#ffffff;
  --panel-bg:#ffffff;
  --input-bg:#ffffff;
  --btn-bg:#f0f0f0;
  --btn-active:#d0d0d0;
  --border:#000000;
  --slider-bg:#c0c0c0;
  --muted:#666666;
  --accent:#000080;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#111111;
    --text:#f0f0f0;
    --fg:#f0f0f0;
    --panel:#1a1a1a;
    --panel-bg:#1a1a1a;
    --input-bg:#2a2a2a;
    --btn-bg:#2a2a2a;
    --btn-active:#3a3a3a;
    --border:#ffffff;
    --slider-bg:#444444;
    --muted:#bbbbbb;
    --accent:#9db4ff;
  }
}

[data-theme="light"]{
  --bg:#ffffff;
  --text:#000000;
  --fg:#000000;
  --panel:#ffffff;
  --panel-bg:#ffffff;
  --input-bg:#ffffff;
  --btn-bg:#f0f0f0;
  --btn-active:#d0d0d0;
  --border:#000000;
  --slider-bg:#c0c0c0;
  --muted:#666666;
  --accent:#000080;
}

[data-theme="dark"]{
  --bg:#111111;
  --text:#f0f0f0;
  --fg:#f0f0f0;
  --panel:#1a1a1a;
  --panel-bg:#1a1a1a;
  --input-bg:#2a2a2a;
  --btn-bg:#2a2a2a;
  --btn-active:#3a3a3a;
  --border:#ffffff;
  --slider-bg:#444444;
  --muted:#bbbbbb;
  --accent:#9db4ff;

*{
  box-sizing:border-box;
  border-radius:0 !important
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text)
}

body{
  font-family:"MS Gothic","ＭＳ ゴシック",monospace;
  background:var(--bg);
  color:var(--text)
}

input,textarea,button,select{
  font-family:"MS Gothic","ＭＳ ゴシック",monospace;
  color:var(--text)
}

button{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent
}

input[type="text"],textarea{
  -webkit-user-select:text;
  -moz-user-select:text;
       user-select:text
}

.tk-btn,.btn{
  background:var(--btn-bg);
  border:1px solid var(--border);
  color:var(--text);
  font-size:12px;
  cursor:pointer;
  padding:8px 10px;
  outline:none;
  text-align:center;
  border-radius:0
}

.tk-btn:active,.btn:active{
  background:var(--btn-active)
}

.btn:disabled{
  opacity:.55;
  cursor:default
}

.btn-primary{
  background:var(--text);
  color:var(--bg);
  border-color:var(--text);
  font-weight:bold
}

.gear-btn{
  font-size:16px;
  padding:4px 8px;
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:var(--btn-bg);
  border:1px solid var(--border);
  color:var(--text)
}

.btn-listen,.btn-generate{
  width:100%;
  padding:10px;
  font-size:12px;
  line-height:1.5;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--btn-bg);
  color:var(--text)
}

.btn-generate{
  font-weight:bold
}

.action-area{
  margin-top:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  width:100%;
  padding-bottom:10px
}

.custom-select-container{
  position:relative;
  width:160px;
  margin:6px auto 0;
  color:var(--text)
}

.select-box{
  background:var(--input-bg);
  border:1px solid var(--border);
  padding:4px 8px;
  font-size:13px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  color:var(--text)
}

.select-box:active{
  background:var(--btn-active)
}

.dropdown-menu{
  display:block;
  position:absolute;
  top:100%;
  left:0;
  width:100%;
  max-height:200px;
  overflow-y:auto;
  background:var(--input-bg);
  border:1px solid var(--border);
  box-shadow:2px 2px 5px rgba(0,0,0,0.2);
  z-index:10;
  text-align:left;
  color:var(--text)
}

.dropdown-item{
  display:flex;
  width:100%;
  padding:6px 10px;
  font-size:12px;
  cursor:pointer;
  background:var(--input-bg);
  border:none;
  border-bottom:1px dotted var(--border);
  color:var(--text);
  text-align:left;
  align-items:center;
  gap:8px
}

.dropdown-item:last-child{
  border-bottom:none
}

.modal-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:16px
}

.modal-actions .btn{
  flex:1;
  min-width:120px
}

.modal{
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  box-shadow:4px 4px 12px rgba(0,0,0,0.35)
}

.tk-input-wrap{
  border:1px solid var(--border);
  background:var(--input-bg);
  display:block;
  padding:1px
}

.tk-input-wrap input[type="text"]{
  border:none;
  outline:none;
  font-size:16px;
  padding:4px 6px;
  background:transparent;
  width:100%;
  color:var(--text)
}

.tk-textarea{
  width:100%;
  height:80px;
  resize:none;
  border:none;
  outline:none;
  font-size:16px;
  padding:4px;
  background:var(--input-bg);
  color:var(--text)
}

input[type="range"]{
  width:100%;
  accent-color:var(--muted);
  background:var(--slider-bg);
  height:6px;
  border-radius:0;
  -moz-appearance:none;
       appearance:none;
  -webkit-appearance:none;
  outline:none
}

input[type="range"]::-webkit-slider-runnable-track{
  height:6px;
  background:var(--slider-bg)
}

input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:14px;
  height:14px;
  margin-top:-4px;
  border-radius:0;
  background:var(--muted);
  border:1px solid var(--border);
  cursor:pointer
}

input[type="range"]::-moz-range-track{
  height:6px;
  background:var(--slider-bg)
}

input[type="range"]::-moz-range-thumb{
  width:14px;
  height:14px;
  border-radius:0;
  background:var(--muted);
  border:1px solid var(--border);
  cursor:pointer
}

input[type="radio"]{
  accent-color:#007bff
}

input[type="checkbox"]{
  accent-color:var(--muted)
}

a{
  color:var(--accent)
}

label{
  color:var(--text)
}
