<html lang="ja"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utaun Web Korean</title>
<style>
:root{--bg:#ffffff;--fg:#000000;--panel-bg:#ffffff;--input-bg:#ffffff;--btn-bg:#f0f0f0;--btn-active:#d0d0d0;--border:#7f7f7f;--slider-bg:#c0c0c0;--muted:#555555;--accent:#000080}
@media (prefers-color-scheme: dark){:root{--bg:#121212;--fg:#e0e0e0;--panel-bg:#1e1e1e;--input-bg:#2a2a2a;--btn-bg:#333333;--btn-active:#444444;--border:#ffffff;--slider-bg:#444444;--muted:#aaaaaa;--accent:#9db4ff}}
[data-theme="light"]{--bg:#ffffff;--fg:#000000;--panel-bg:#ffffff;--input-bg:#ffffff;--btn-bg:#f0f0f0;--btn-active:#d0d0d0;--border:#7f7f7f;--slider-bg:#c0c0c0;--muted:#555555;--accent:#000080}
[data-theme="dark"]{--bg:#121212;--fg:#e0e0e0;--panel-bg:#1e1e1e;--input-bg:#2a2a2a;--btn-bg:#333333;--btn-active:#444444;--border:#ffffff;--slider-bg:#444444;--muted:#aaaaaa;--accent:#9db4ff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:"MS Gothic","ＭＳ ゴシック",monospace;color:var(--fg);background:var(--bg)}
input,textarea,button,select{font-family:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input[type="text"],textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:20px;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow-x:clip}
h1{font-size:28px;font-weight:bold;margin:0}
label{font-size:13px;margin-bottom:3px;display:block}
.tk-btn{background:var(--btn-bg);border:1px solid var(--border);color:var(--fg);font-size:12px;cursor:pointer;padding:8px 10px;outline:none;text-align:center}
.tk-btn:active{background:var(--btn-active)}
.btn{background:var(--btn-bg);border:1px solid var(--border);color:var(--fg);font-size:12px;cursor:pointer;padding:8px 10px;outline:none;text-align:center;border-radius:0}
.btn:active{background:var(--btn-active)}
.btn:disabled{opacity:.55;cursor:default}
.gear-btn{font-size:16px;padding:4px 8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-listen,.btn-generate{width:100%;padding:10px;font-size:12px;line-height:1.5;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.btn-generate{font-weight:bold}
.btn-primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:bold}
.action-area{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding-bottom:10px}
.tk-input-wrap{border:1px solid var(--border);background:var(--input-bg);display:block;padding:1px}
.tk-input-wrap input[type="text"]{border:none;outline:none;font-size:16px;padding:4px 6px;background:transparent;width:100%;color:var(--fg)}
input[type="range"]{width:100%;accent-color:#555;background:var(--slider-bg);height:6px}
.custom-select-container{position:relative;width:160px;margin:6px auto 0}
.select-box{background:var(--input-bg);border:1px solid var(--border);padding:4px 8px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;color:var(--fg)}
.dropdown-menu{position:absolute;top:100%;left:0;width:100%;max-height:200px;overflow-y:auto;background:var(--input-bg);border:1px solid var(--border);box-shadow:2px 2px 5px rgba(0,0,0,.2);z-index:10}
.dropdown-item{display:flex;padding:6px 10px;font-size:12px;border-bottom:1px dotted #e0e0e0;gap:8px;cursor:pointer;background:transparent;border-left:none;border-right:none;border-top:none;color:var(--fg);width:100%;text-align:left}
.modal-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55)}
.modal{background:var(--panel-bg);color:var(--fg);border:1px solid var(--border);padding:18px;box-shadow:4px 4px 12px rgba(0,0,0,.35);width:100%;max-width:440px;max-height:calc(100dvh - 40px);overflow-y:auto}
.modal h2{font-size:15px;font-weight:bold;margin:0 0 12px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal-actions .btn{flex:1;min-width:120px}
#icon-preview{width:32px;height:32px;border:1px solid var(--border);background:#fff;flex-shrink:0;object-fit:cover;display:block}
</style></head><body>

const SR=44100;
const FORMANTS={"あ":[800,1200,2900],"い":[450,2600,3200],"う":[300,1250,2400],"え":[700,2200,2900],"お":[600,850,2400],"ん":[300,800,2200]};
function synthFormant(ch,pitch,f3){
  const base=FORMANTS[ch]||[800,1200,2500];
  const l=Math.max(0,pitch-200)*0.25;
  const f=[(base[0]+l)*1.25,(base[1]+l)*1.25,(base[2]||2500)*1.25*f3];
  const n=Math.floor(SR*1), sig=new Float64Array(n); let peak=0;
  const maxH=Math.floor(SR/2/pitch), pFactor=0.55+0.45*(Math.min(Math.max(f3,0),1.5)/1.5);

  return {sig,peak,n};
}

function wavBytes(seg){const n=seg.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf); const w=(off,s)=>{for(let i=0;i<s.length;i++) v.setUint8(off+i,s.charCodeAt(i));}; w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,SR,true); v.setUint32(28,SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true); for(let i=0;i<n;i++) v.setInt16(44+i*2,seg[i],true); return new Uint8Array(buf);}

let sjMap=null; function getSjMap(){if(sjMap) return sjMap; const dec=new TextDecoder("shift_jis"); const m=new Map(); for(let hi=129;hi<=252;hi++){if(hi>159&&hi<224) continue; for(let lo=64;lo<=252;lo++){if(lo===127) continue; const ch=dec.decode(new Uint8Array([hi,lo])); if(ch.length===1&&ch!=="�"&&!m.has(ch)) m.set(ch,[hi,lo]);}} sjMap=m; return m;}

function makeFrq(samples,pitch){const n=Math.max(1,Math.ceil(samples.length/256)); const out=new Uint8Array(40+n*16), v=new DataView(out.buffer); "FREQ0003".split("").forEach((c,i)=>out[i]=c.charCodeAt(0)); v.setInt32(8,256,true); v.setFloat64(12,pitch,true); v.setInt32(36,n,true); for(let i=0;i<n;i++){const s=i*256, e=Math.min(samples.length,s+256); let mx=0; for(let j=s;j<e;j++){const a=Math.abs(samples[j]/32768); if(a>mx) mx=a;} v.setFloat64(40+i*16,pitch,true); v.setFloat64(48+i*16,mx,true);} return out;}

let consList=null, consListTried=false; async function getConsList(){if(consListTried) return consList; consListTried=true; try{const r=await fetch("consonants/list.json"); if(!r.ok) return consList=null; if((r.headers.get("content-type")||"").toLowerCase().includes("text/html")) return consList=null; const txt=(await r.text()).replace(/^\uFEFF/,""); const low=txt.trimStart().toLowerCase(); if(low.startsWith("<!doctype")||low.startsWith("<html")) return consList=null; let arr=[]; try{const j=JSON.parse(txt); arr=Array.isArray(j)?j:Array.isArray(j?.files)?j.files:Array.isArray(j?.list)?j.list:[];}catch(e){arr=txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);} consList=arr.filter(s=>typeof s==="string"&&s.length>0); return consList;}catch(e){return consList=null;}}

function canvasToBMP(canvas){const w=canvas.width, h=canvas.height; const ctx=canvas.getContext("2d"); const img=ctx.getImageData(0,0,w,h).data; const rowSize=((w*3+3)&~3); const pix=new Uint8Array(rowSize*h); for(let y=0;y<h;y++){for(let x=0;x<w;x++){const si=(y*w+x)*4; const di=((h-1-y)*rowSize)+x*3; pix[di]=img[si+2]; pix[di+1]=img[si+1]; pix[di+2]=img[si];}} const out=new Uint8Array(54+pix.length); const v=new DataView(out.buffer); "BM".split("").forEach((ch,i)=>out[i]=ch.charCodeAt(0)); v.setUint32(2,54+pix.length,true); v.setUint32(10,54,true); v.setUint32(14,40,true); v.setInt32(18,w,true); v.setInt32(22,h,true); v.setUint16(26,1,true); v.setUint16(28,24,true); v.setUint32(34,pix.length,true); out.set(pix,54); return out;}

    const author=(document.getElementById("input-author").value.trim()||"User").normalize("NFC");
    const enc=document.querySelector('input[name="encoding"]:checked')?.value||"shift_jis";
    const pitch=+document.getElementById("slider-height").value, f3=+document.getElementById("slider-f3").value;
    const folder=name.replace(/[\\/:*?"<>|]/g,"_")+"/";
    const D=new Map(); const put=(p,b)=>D.set(folder+p,b); const encFn=s=>encodeText(s,enc);
    put("character.txt", encFn("name="+name+"\r\nimage=icon.jpg\r\nauthor="+author));
    // ICON: always generate from canvas (white if no image)
    try{const cv=makeIconCanvas(); put("icon.bmp", canvasToBMP(cv)); const jpg=await canvasToJpeg(cv); if(jpg) put("icon.jpg", jpg);}catch(e){}
    const V={}; for(const ch of "あいうえおん") V[ch]=vowelInt16(ch,pitch,f3);
    const roma={"あ":"a","い":"i","う":"u","え":"e","お":"o","ん":"nn"};
    for(const ch of "あいうえおん"){const w=wavBytes(V[ch]); put(ch+".wav",w); put(roma[ch]+".wav",w);}

    for(const [p,baseCh,cut,hiraStr] of rows){
      const head=V[baseCh].subarray(0,cut);
      const combos=p==="m"||p==="n"?[["あ","a",0],["い","i",1],["う","u",2],["え","e",3],["お","o",4]]:p==="y"?[["あ","a",0],["う","u",1],["お","o",2]]:[["あ","a",0],["お","o",1]];
      for(const [hch,rom,idx] of combos){const w=wavBytes(concatInt16(head,V[hch])); put(p+idx+".wav",w); put(hiraStr[idx]+".wav",w);}
    }
    const consList=[["ka","か"],["ki","き"],["ku","く"],["ke","け"],["ko","こ"],["sa","さ"],["shi","し"],["su","す"],["se","せ"],["so","そ"],["ta","た"],["chi","ち"],["tsu","つ"],["te","て"],["to","と"],["na","な"],["ni","に"],["nu","ぬ"],["ne","ね"],["no","の"],["ha","は"],["hi","ひ"],["hu","ふ"],["he","へ"],["ho","ほ"],["ma","ま"],["mi","み"],["mu","む"],["me","め"],["mo","も"],["ya","や"],["yu","ゆ"],["yo","よ"],["ra","ら"],["ri","り"],["ru","る"],["re","れ"],["ro","ろ"],["wa","わ"],["wo","を"],["ga","が"],["gi","ぎ"],["gu","ぐ"],["ge","げ"],["go","ご"],["za","ざ"],["ji","じ"],["zu","ず"],["ze","ぜ"],["zo","ぞ"],["da","だ"],["di","ぢ"],["du","づ"],["de","で"],["do","ど"],["ba","ば"],["bi","び"],["bu","ぶ"],["be","べ"],["bo","ぼ"],["pa","ぱ"],["pi","ぴ"],["pu","ぷ"],["pe","ぺ"],["po","ぽ"]];

    }

    const frqCache=new Map();
    for(const [p,bytes] of [...D]){

    document.getElementById("modal-text").textContent="生成完了: wav "+wavCount+"個 / frq "+frqCount+"個";
    document.getElementById("modal").style.display="flex";
  }catch(e){alert("生成エラー: "+(e?.message||String(e)));}
  finally{generating=false; btn.disabled=false;}
}

  if(mod&&(e.key==="a"||e.key==="A"||e.key==="c"||e.key==="C"||e.key==="v"||e.key==="V")) return;
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key==="Enter"&&document.getElementById("view-settings").style.display==="flex"){const tg=e.target; if(tg&&(tg.tagName==="BUTTON"||tg.tagName==="TEXTAREA")) return; e.preventDefault(); applySettings();}
});
document.addEventListener("click",e=>{const m=document.getElementById("lang-menu"); if(m.style.display==="block"&&!e.target.closest(".custom-select-container")) m.style.display="none";});

</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArt
